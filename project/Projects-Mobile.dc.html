<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects mobile preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..800&amp;family=Manrope:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#07080F}
a{color:inherit}
.ff-dark a:hover{color:#FFBC51}
.ff-cream a:hover{color:#C93A3C}
:focus-visible{outline:3px solid #FFBC51;outline-offset:3px}
.ff-cream :focus-visible{outline-color:#C93A3C}
@keyframes ff-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ff-spin{to{transform:rotate(360deg)}}
@keyframes ff-focus{from{filter:blur(12px);opacity:0;transform:scale(.97)}to{filter:blur(0);opacity:1;transform:none}}
.ff-core{animation:ff-breathe 7s ease-in-out infinite}
.ff-orbit{animation:ff-spin 60s linear infinite}
.ff-in{animation:ff-focus 1.1s cubic-bezier(.22,1,.36,1) both}
.ff-root{container-type:inline-size;container-name:page}
.ff-grp{display:flex}.ff-gtoggle{display:none}
footer a,.ff-links a,nav[aria-label="Breadcrumb"] a{min-height:24px;display:inline-flex;align-items:center}
.ph-d,.ph-c{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:14px 16px;box-sizing:border-box}
.ph-d{border:1px dashed rgba(255,188,81,0.6);background:rgba(255,188,81,0.06)}
.ph-c{border:1px dashed rgba(201,58,60,0.55);background:rgba(201,58,60,0.04)}
.ph-l{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase}
.ph-d .ph-l{color:#FFBC51}.ph-c .ph-l{color:#C93A3C}
.ph-t{font-size:14px;line-height:1.5}
.ph-d .ph-t{color:#E9E3DC}.ph-c .ph-t{color:#2A2830}
@container page (max-width: 940px){.ff-links{display:none !important}}
@container page (max-width: 760px){.ff-gtitle{display:none !important}.ff-gtoggle{display:flex}.ff-grp{display:none}.ff-grp.ff-open{display:flex}.ff-hide-sm{display:none !important}}
@media (prefers-reduced-motion: reduce){.ff-core,.ff-orbit,.ff-in{animation:none}}
.ff-skip{position:absolute;left:16px;top:16px;z-index:40;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#FFBC51;color:#0B0C14;font-family:'Manrope',Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none;opacity:0;transform:translateY(-200%);pointer-events:none}
.ff-skip:focus{opacity:1;transform:none;pointer-events:auto}.ff-skip:hover{color:#0B0C14}.ff-skip:focus-visible{outline:3px solid #FAF5EF;outline-offset:3px}
#main:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 6014px; overflow: hidden; background: #FAF5EF; font-family: 'Manrope', Arial, sans-serif; color: #FAF5EF">
  <div style="{{ clipStyle }}">
    <div id="pj-frame" style="{{ innerStyle }}">
      <dc-import name="B-Projects" hint-size="390px,19966px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":6014}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mt: 0, h: 5954 };
  }
  componentDidMount() {
    const run = () => this.fit();
    [150, 600, 1500, 3000, 6000].forEach((t) => setTimeout(run, t));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
    window.addEventListener('resize', run);
  }
  fit() {
    /* split-frame alignment: START = "top", END = ["row", 5] */
    const box = document.getElementById('pj-frame'); if (!box) return;
    const base = box.getBoundingClientRect().top;
    const rel = (el) => { const r = el.getBoundingClientRect(); return { top: r.top - base, bottom: r.bottom - base }; };
    const rows = [];
    [...box.querySelectorAll('.cw-card')].map(rel).forEach((r) => { const k = rows.find((x) => Math.abs(x.top - r.top) < 2); if (k) k.bottom = Math.max(k.bottom, r.bottom); else rows.push({ top: r.top, bottom: r.bottom }); });
    rows.sort((a, b) => a.top - b.top);
    const gapBefore = (n) => (n > 0 && rows[n] && rows[n - 1]) ? (rows[n - 1].bottom + rows[n].top) / 2 : null;
    const gapAfter = (n) => (rows[n] && rows[n + 1]) ? (rows[n].bottom + rows[n + 1].top) / 2 : null;
    const START = "top", END = ["row", 5];
    let s = null, e = null;
    if (START === 'top') s = 0; else if (START === 'cw') { const c = box.querySelector('#pj-creative'); s = c ? rel(c).top - 36 : null; } else s = gapBefore(START[1]);
    if (END === 'end') { const f = box.querySelector('footer'); e = f ? rel(f).bottom : null; } else e = gapAfter(END[1]);
    if (s === null || e === null || !(e > s)) return;
    const mt = Math.round(s), h = Math.round(e - s);
    if (mt !== this.state.mt || h !== this.state.h) this.setState({ mt: mt, h: h });
  }
  renderVals() {
    return { innerStyle: 'margin-top: -' + this.state.mt + 'px', clipStyle: 'height: ' + this.state.h + 'px; overflow: hidden' };
  }
}
</script>
</body>
</html>
