<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homepage tablet preview part 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..800&amp;family=Manrope:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#07080F}
a{color:inherit}
.ff-dark a:hover{color:#FFBC51}
.ff-cream a:hover{color:#C93A3C}
:focus-visible{outline:3px solid #FFBC51;outline-offset:3px}
@keyframes ff-spin{to{transform:rotate(360deg)}}
@keyframes ff-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ff-focus{from{filter:blur(12px);opacity:0;transform:scale(.97)}to{filter:blur(0);opacity:1;transform:none}}
@keyframes ff-fill{0%,35%{color:transparent}100%{color:#FFBC51}}
.ff-orbit{animation:ff-spin 48s linear infinite}
.ff-orbit-r{animation:ff-spin 70s linear infinite reverse}
.ff-core{animation:ff-breathe 7s ease-in-out infinite}
.ff-float{animation:ff-float 8s ease-in-out infinite}
.ff-in{animation:ff-focus 1.1s cubic-bezier(.22,1,.36,1) both}
.ff-lit{animation:ff-fill 2.4s cubic-bezier(.22,1,.36,1) .5s both}
.ff-root{container-type:inline-size;container-name:page}
.ff-list{display:none}
.ff-mob{display:none}
.ff-grp{display:flex}.ff-gtoggle{display:none}
.lp-hide{display:none}.lp-on{fill:#FFBC51;r:18px}.lp-done{fill:#0B0C14}.lp-todo{fill:#E3DACE}
footer a,.ff-links a,nav[aria-label="Breadcrumb"] a{min-height:24px;display:inline-flex;align-items:center}
.ph-c{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:12px 14px;box-sizing:border-box;border:1px dashed rgba(201,58,60,0.55);background:rgba(201,58,60,0.04)}
.ph-l{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#C93A3C}
.ph-t{font-size:14px;line-height:1.5;color:#2A2830}
@container page (max-width: 760px){.ff-gtitle{display:none !important}.ff-gtoggle{display:flex}.ff-grp{display:none}.ff-grp.ff-open{display:flex}}
.ff-snap::-webkit-scrollbar{height:6px}.ff-snap::-webkit-scrollbar-thumb{background:rgba(250,245,239,0.25);border-radius:6px}
@container page (max-width: 940px){.ff-links{display:none !important}}
@container page (max-width: 760px){.ff-orbitwrap{display:none !important}.ff-list{display:flex}.ff-hide-sm{display:none !important}.ff-workdesk{display:none !important}.ff-mob{display:flex}}
@media (prefers-reduced-motion: reduce){.ff-orbit,.ff-orbit-r,.ff-core,.ff-float,.ff-in{animation:none}.ff-lit{animation:none;color:#FFBC51}}
.ff-cream :focus-visible{outline-color:#C93A3C}
.ff-skip{position:absolute;left:16px;top:16px;z-index:40;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#FFBC51;color:#0B0C14;font-family:'Manrope',Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none;opacity:0;transform:translateY(-200%);pointer-events:none}
.ff-skip:focus{opacity:1;transform:none;pointer-events:auto}.ff-skip:hover{color:#0B0C14}.ff-skip:focus-visible{outline:3px solid #FAF5EF;outline-offset:3px}
#main:focus{outline:none}
</style>
</helmet>
<div style="width: 834px; height: 2912px; overflow: hidden; background: #07080F; font-family: 'Manrope', Arial, sans-serif; color: #FAF5EF">
  <div style="margin-top: -7900px">
    <dc-import name="B-Home" hint-size="834px,10812px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":2912}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
