<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>About page tablet preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..800&amp;family=Manrope:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#07080F}
a{color:inherit}
.ff-dark a:hover{color:#FFBC51}
.ff-cream a:hover{color:#C93A3C}
:focus-visible{outline:3px solid #FFBC51;outline-offset:3px}
.ff-cream :focus-visible{outline-color:#C93A3C}
@keyframes ff-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ff-spin{to{transform:rotate(360deg)}}
@keyframes ff-focus{from{filter:blur(12px);opacity:0;transform:scale(.97)}to{filter:blur(0);opacity:1;transform:none}}
.ff-core{animation:ff-breathe 7s ease-in-out infinite}
.ff-orbit{animation:ff-spin 60s linear infinite}
.ff-in{animation:ff-focus 1.1s cubic-bezier(.22,1,.36,1) both}
.ff-root{container-type:inline-size;container-name:page}
.ff-grp{display:flex}.ff-gtoggle{display:none}
footer a,.ff-links a,nav[aria-label="Breadcrumb"] a{min-height:24px;display:inline-flex;align-items:center}
.ph-d,.ph-c{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:14px 16px;box-sizing:border-box}
.ph-d{border:1px dashed rgba(255,188,81,0.6);background:rgba(255,188,81,0.06)}
.ph-c{border:1px dashed rgba(201,58,60,0.55);background:rgba(201,58,60,0.04)}
.ph-l{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase}
.ph-d .ph-l{color:#FFBC51}.ph-c .ph-l{color:#C93A3C}
.ph-t{font-size:14px;line-height:1.5}
.ph-d .ph-t{color:#E9E3DC}.ph-c .ph-t{color:#2A2830}
@container page (max-width: 940px){.ff-links{display:none !important}}
@container page (max-width: 760px){.ff-gtitle{display:none !important}.ff-gtoggle{display:flex}.ff-grp{display:none}.ff-grp.ff-open{display:flex}.ff-hide-sm{display:none !important}}
@media (prefers-reduced-motion: reduce){.ff-core,.ff-orbit,.ff-in{animation:none}}
</style>
<style>
.ab-sec{padding:clamp(80px,9cqi,128px) clamp(16px,3.4cqi,48px)}
.ab-wrap{width:min(1200px,100%);margin:0 auto;box-sizing:border-box}
.ab-eyebrow{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 14px;border-radius:999px;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em}
.ab-eyebrow-d{background:rgba(250,245,239,.07);border:1px solid rgba(250,245,239,.18);color:#FAF5EF}
.ab-eyebrow-c{background:#FFFFFF;border:1px solid #E3DACE;color:#0B0C14}
.ab-dot{width:7px;height:7px;border-radius:50%;flex:none}
.ab-h2{margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(30px,4.2cqi,58px);font-weight:600;line-height:1.06;letter-spacing:-.05em}
.ab-h3{margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(19px,1.6cqi,22px);font-weight:600;letter-spacing:-.04em;line-height:1.2}
.ab-btn{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 10px 0 24px;border-radius:999px;text-decoration:none;font-weight:700;box-sizing:border-box}
.ab-btn-amber{background:#FFBC51;color:#0B0C14}
.ff-dark a.ab-btn-amber:hover{color:#0B0C14;background:#FFCD78}
.ab-btn-ghost{padding:0 26px;background:rgba(250,245,239,.07);border:1px solid rgba(250,245,239,.3);color:#FAF5EF}
.ab-btn-ic{width:38px;height:38px;flex:none;border-radius:50%;background:#0B0C14;display:inline-flex;align-items:center;justify-content:center}
.ab-chip{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:rgba(14,16,32,.92);border:1px solid rgba(250,245,239,.24);color:#FAF5EF;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;white-space:nowrap}
.ab-orb-l{position:absolute;transform:translate(-50%,-50%);font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.16em;white-space:nowrap}
.ab-sticky{position:sticky;top:24px}
.ab-pillar{display:flex;gap:18px;align-items:flex-start;padding:24px 26px;border-radius:28px;background:rgba(250,245,239,.05);border:1px solid rgba(250,245,239,.14)}
.ab-pillar p{margin:8px 0 0;font-size:16px;line-height:1.65;color:#D9D3CC}
.ab-num{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12px}
.ab-mv{position:relative;overflow:hidden;border-radius:36px;padding:clamp(28px,3.4cqi,48px);display:flex;flex-direction:column;gap:18px;min-height:280px;box-sizing:border-box}
.ab-mv-h{margin:0;font-family:'Geist Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.ab-mv-p{position:relative;margin:0;font-family:'Unbounded',sans-serif;font-size:clamp(21px,2.2cqi,30px);font-weight:500;line-height:1.3;letter-spacing:-.035em}
.ab-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ab-val{display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:28px;background:#FAF5EF;border:1px solid #E3DACE}
.ab-val p{margin:0;font-size:16px;line-height:1.65;color:#2A2830}
.ab-val-n{font-family:'Geist Mono',monospace;font-size:12px;color:#C93A3C}
.ab-x{display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:28px;background:rgba(250,245,239,.05);border:1px solid rgba(250,245,239,.14)}
.ab-x-n{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;color:#FFBC51}
.ab-x-primary{align-self:flex-start;display:inline-block;min-height:44px;box-sizing:border-box;padding:11px 0;line-height:22px;font-weight:700;font-size:15px;color:#FFBC51;text-decoration:none}.ab-x-primary svg{display:inline-block;vertical-align:-2px;margin-left:6px}
.ab-x-link{display:inline-flex;align-items:center;min-height:32px;font-size:14px;color:#E9E3DC;text-decoration:none}
.ff-dark a.ab-x-link:hover{color:#FFBC51}
.ab-who{display:flex;flex-direction:column;gap:14px}
.ab-track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.ab-track::before{content:"";position:absolute;left:26px;right:26px;top:33px;height:1px;background:linear-gradient(90deg,#FF5C5E,#FFBC51)}
.ab-stage{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px 26px 26px;border-radius:28px;background:#FFFFFF;border:1px solid #E3DACE}
.ab-stage p,.ab-going p{margin:0;font-size:16px;line-height:1.65;color:#2A2830}
.ab-stage-dot{width:16px;height:16px;border-radius:50%;background:#FFBC51;box-shadow:0 0 0 5px #FFFFFF,0 0 0 6px #E3DACE;margin-bottom:4px}
.ab-going{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:26px 28px;border-radius:28px;background:#0B0C14}
.ab-going p{color:#D9D3CC;max-width:640px}
@container page (max-width: 940px){.ab-values{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container page (max-width: 760px){.ab-values{grid-template-columns:1fr}.ab-track{grid-template-columns:1fr}.ab-track::before{left:33px;right:auto;top:26px;bottom:26px;width:1px;height:auto;background:linear-gradient(180deg,#FF5C5E,#FFBC51)}.ab-sticky{position:static}}
.ff-skip{position:absolute;left:16px;top:16px;z-index:40;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#FFBC51;color:#0B0C14;font-family:'Manrope',Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none;opacity:0;transform:translateY(-200%);pointer-events:none}
.ff-skip:focus{opacity:1;transform:none;pointer-events:auto}.ff-skip:hover{color:#0B0C14}.ff-skip:focus-visible{outline:3px solid #FAF5EF;outline-offset:3px}
#main:focus{outline:none}
[data-offscreen="1"] .ff-orbit,[data-offscreen="1"] .ff-core{animation-play-state:paused}
.ff-soc{width:44px;height:44px;box-sizing:border-box;border-radius:50%;display:inline-flex !important;align-items:center;justify-content:center;border:1px solid rgba(250,245,239,0.22);background:rgba(250,245,239,0.04);color:#FAF5EF;text-decoration:none;transition:border-color .2s ease,background-color .2s ease}
.ff-dark a.ff-soc:hover,.ff-soc:hover{color:#FAF5EF;border-color:#FFBC51;background:rgba(255,188,81,0.14)}
.ff-soc:focus-visible{outline:3px solid #FFBC51;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.ff-soc{transition:none}}
@container page (max-width: 1100px){.hp-offices{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.hp-offices > :last-child:nth-child(odd){grid-column:1 / -1}}
@container page (max-width: 760px){.hp-offices{grid-template-columns:minmax(0,1fr) !important}}
</style>
</helmet>
<div style="width: 834px; height: 8000px; overflow: hidden; background: #07080F; font-family: 'Manrope', Arial, sans-serif; color: #FAF5EF">
  <dc-import name="About" hint-size="834px,9167px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":8000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
