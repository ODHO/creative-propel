<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..800&amp;family=Manrope:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#07080F}
a{color:inherit}
.ff-dark a:hover{color:#FFBC51}
.ff-cream a:hover{color:#C93A3C}
:focus-visible{outline:3px solid #FFBC51;outline-offset:3px}
@keyframes ff-spin{to{transform:rotate(360deg)}}
@keyframes ff-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ff-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ff-focus{from{filter:blur(12px);opacity:0;transform:scale(.97)}to{filter:blur(0);opacity:1;transform:none}}
@keyframes ff-fill{0%,35%{color:transparent}100%{color:#FFBC51}}
.ff-orbit{animation:ff-spin 48s linear infinite}
.ff-core{animation:ff-breathe 7s ease-in-out infinite}
.ff-float{animation:ff-float 8s ease-in-out infinite}
.ff-in{animation:ff-focus 1.1s cubic-bezier(.22,1,.36,1) both}
.ff-lit{animation:ff-fill 2.4s cubic-bezier(.22,1,.36,1) .5s both}
.ff-stage{animation:ff-focus .7s cubic-bezier(.22,1,.36,1) both}
.ff-root{container-type:inline-size;container-name:page}
.ff-list{display:none}
.ff-grp{display:flex}.ff-gtoggle{display:none}
.lp-hide{display:none}
.ff-cream :focus-visible{outline-color:#C93A3C}
.ff-skip{position:absolute;left:16px;top:16px;z-index:40;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#FFBC51;color:#0B0C14;font-family:'Manrope',Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none;opacity:0;transform:translateY(-200%);pointer-events:none}
.ff-skip:focus{opacity:1;transform:none;pointer-events:auto}.ff-skip:hover{color:#0B0C14}.ff-skip:focus-visible{outline:3px solid #FAF5EF;outline-offset:3px}
#main:focus{outline:none}
.ff-soc{width:44px;height:44px;box-sizing:border-box;border-radius:50%;display:inline-flex !important;align-items:center;justify-content:center;border:1px solid rgba(250,245,239,0.22);background:rgba(250,245,239,0.04);color:#FAF5EF;text-decoration:none;transition:border-color .2s ease,background-color .2s ease}
.ff-dark a.ff-soc:hover,.ff-soc:hover{color:#FAF5EF;border-color:#FFBC51;background:rgba(255,188,81,0.14)}
.ff-soc:focus-visible{outline:3px solid #FFBC51;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.ff-soc{transition:none}}
.ff-cream a.cw-card,.ff-cream a.cw-card:hover{color:#0B0C14}
@container page (max-width: 1100px){.hp-offices{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.hp-offices > :last-child:nth-child(odd){grid-column:1 / -1}}
@container page (max-width: 760px){.hp-offices{grid-template-columns:minmax(0,1fr) !important}}
section[aria-labelledby="ds-enq-h"] a:hover{color:#FFBC51}
section[aria-labelledby="ds-enq-h"] a[href="Contact.dc.html"]:hover{color:#0B0C14}
section[aria-labelledby="ds-enq-h"] :focus-visible{outline-color:#FFBC51}
[data-offscreen="1"] .ff-orbit,[data-offscreen="1"] .ff-core,[data-offscreen="1"] .ff-float{animation-play-state:paused}
.ds-p{margin:0;font-size:18px;line-height:1.7}
.ds-cap{scroll-margin-top:24px}
footer a,.ff-links a,nav[aria-label="Breadcrumb"] a{min-height:24px;display:inline-flex;align-items:center}
.ph-d,.ph-c{display:flex;flex-direction:column;gap:6px;border-radius:16px;padding:14px 16px;box-sizing:border-box}
.ph-d{border:1px dashed rgba(255,188,81,0.6);background:rgba(255,188,81,0.06)}
.ph-c{border:1px dashed rgba(201,58,60,0.55);background:rgba(201,58,60,0.04)}
.ph-l{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.16em;text-transform:uppercase}
.ph-d .ph-l{color:#FFBC51}.ph-c .ph-l{color:#C93A3C}
.ph-t{font-size:14px;line-height:1.5}
.ph-d .ph-t{color:#E9E3DC}.ph-c .ph-t{color:#2A2830}
@container page (max-width: 940px){.ff-links{display:none !important}}
@container page (max-width: 760px){.ff-hide-sm{display:none !important}.ff-labwrap{display:none !important}.ff-list{display:flex}.ff-gtitle{display:none !important}.ff-gtoggle{display:flex}.ff-grp{display:none}.ff-grp.ff-open{display:flex}}
@media (prefers-reduced-motion: reduce){.ff-orbit,.ff-core,.ff-float,.ff-in,.ff-stage{animation:none}.ff-lit{animation:none;color:#FFBC51}}
.wd-work{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.wd-steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@container page (max-width: 1100px){.wd-steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container page (max-width: 760px){.wd-work{grid-template-columns:minmax(0,1fr)}.wd-steps{grid-template-columns:minmax(0,1fr)}}
.ff-dark a.ds-work:hover{color:#0B0C14}
.ds-work{transition:transform .25s ease,box-shadow .25s ease}.ds-work:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,0.35)}
@media (prefers-reduced-motion: reduce){.ds-work{transition:none}.ds-work:hover{transform:none}}
</style>
